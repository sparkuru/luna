worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $uri $luna_cache_control {
    default "no-cache";
    ~^/api(?:/|$) "no-store";
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    set $luna_api http://api:3000;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: http://127.0.0.1:* http://localhost:* http://[::1]:*; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $luna_cache_control always;
    client_max_body_size 12m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    location = /healthz { return 200 "ok\n"; }
    location = /api { return 404; }
    location = /api/v1/auth/sessions {
      client_max_body_size 2k;
      proxy_pass $luna_api$request_uri;
    }
    location = /api/v1/ledgers {
      client_max_body_size 1k;
      proxy_pass $luna_api$request_uri;
    }
    location = /api/v1/preferences/object {
      client_max_body_size 1m;
      proxy_pass $luna_api$request_uri;
    }
    location /api/ { proxy_pass $luna_api$request_uri; }
    location ~ ^/(setup|ledger(?:/menu(?:/(?:settings|budget|statistics|sync|backup|conflicts|account))?)?)/?$ {
      try_files $uri /index.html;
    }
    location / { try_files $uri $uri/ =404; }
  }
}
