services:
  instance-init:
    image: node:22.22.0-bookworm-slim
    command: [node, /init/instance-init.mjs, /data]
    user: "0:0"
    environment:
      LUNA_DATA_UID: "${LUNA_UID:-1000}"
      LUNA_DATA_GID: "${LUNA_GID:-1000}"
    volumes:
      - ${LUNA_DATA_PATH:-./data}:/data
      - ./deploy/instance-init.mjs:/init/instance-init.mjs:ro
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        until [ -f /data/.luna/initialized ]; do sleep 1; done;
        set -a; . /data/.luna/minio.env; set +a;
        exec /usr/bin/minio server /data/minio --address :9000 --console-address :9001
    volumes:
      - ${LUNA_DATA_PATH:-./data}:/data
    user: "${LUNA_UID:-1000}:${LUNA_GID:-1000}"
    depends_on:
      instance-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  api:
    image: luna-api:local
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      LUNA_DATA_DIR: /data
      LUNA_RUNTIME_CONFIG_FILE: /data/.luna/runtime.json
      LUNA_ALLOWED_ORIGINS: "${LUNA_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,https://localhost}"
      LUNA_HOST: 0.0.0.0
      LUNA_PORT: 3000
    volumes:
      - ${LUNA_DATA_PATH:-./data}:/data
    user: "${LUNA_UID:-1000}:${LUNA_GID:-1000}"
    depends_on:
      instance-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    restart: unless-stopped

  web:
    build: .
    image: luna-web:local
    ports:
      - "${LUNA_BIND_HOST:-127.0.0.1}:${LUNA_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
