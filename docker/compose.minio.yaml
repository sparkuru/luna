name: luna-minio-smoke

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LUNA_MINIO_ROOT_USER:-luna-test-access}
      MINIO_ROOT_PASSWORD: ${LUNA_MINIO_ROOT_PASSWORD:-luna-test-secret-2026}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    tmpfs:
      - /data
